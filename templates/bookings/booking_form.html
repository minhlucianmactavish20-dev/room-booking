{% extends "base.html" %}
{% block title %}Đặt phòng{% endblock %}
{% block content %}
<h2>Đặt phòng</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Gửi yêu cầu đặt phòng</button>
    {% if form.non_field_errors %}
        <button type="submit" formaction="{% url 'waitlist_join' %}">Đăng ký chờ khung giờ này</button>
    {% endif %}
</form>
<p><a href="{% url 'dashboard' %}">Quay lại trang chủ</a></p>
{% endblock %}
